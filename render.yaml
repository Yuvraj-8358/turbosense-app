services:
  - type: web
    name: turbosense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python download_models.py && python compact_models.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: GITHUB_REPOSITORY
        sync: false
      - key: MODEL_RELEASE_TAG
        sync: false
      - key: GITHUB_TOKEN
        sync: false
